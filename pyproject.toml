[project]
name = "investtrack"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "dotenv>=0.9.9",
    "fastapi>=0.135.1",
    "flake8>=7.3.0",
    "greenlet>=3.3.2",
    "isort>=8.0.1",
    "ruff>=0.15.4",
    "sqlalchemy>=2.0.48",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
